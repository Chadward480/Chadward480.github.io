<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Acme CRM</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="page" style="max-width:480px;">
    <div class="panel">
      <h1>Sign in</h1>
      <div class="error-list" role="alert"></div>
      <form class="login-form">
        <div class="field">
          <label>Email <input type="text" class="email-input" autocomplete="off"></label>
        </div>
        <div class="field">
          <label>Password <input type="password" class="password-input" autocomplete="off"></label>
        </div>
        <p style="margin-top:20px;">
          <button type="submit" class="btn btn-primary submit-btn">Sign in</button>
        </p>
      </form>
    </div>
  </div>
  <script src="assets/login.js"></script>
</body>
</html>
