<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="frame-inner">
  <section class="panel">
    <h2>Settings</h2>
    <h3>Change password</h3>
    <div class="password-errors" role="alert"></div>
    <div class="field"><label>Current password <input type="password" class="current-pw"></label></div>
    <div class="field"><label>New password <input type="password" class="new-pw"></label></div>
    <div class="field"><label>Confirm new password <input type="password" class="confirm-pw"></label></div>
    <p style="margin-top:16px;"><button class="btn btn-primary save-btn" type="button">Save password</button></p>
    <p style="margin-top:16px;"><a href="login.html"><button class="btn btn-primary">Sign out</button></a></p>
    <iframe class="help-frame" title="Help" src="help.html"></iframe>
  </section>
  <div class="toast" hidden></div>
  <script src="assets/settings.js"></script>
</body>
</html>
